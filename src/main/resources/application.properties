spring.application.name=spring-and-scim

# Logging
logging.level.web=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# PostgreSQL-Datenbank
spring.datasource.url=${SCIM_DB_URL:jdbc:postgresql://localhost:5438/postgres}
spring.datasource.username=${SCIM_DB_USER:postgres}
# Zugangsdaten gehoeren nicht ins Repository; der Default dient nur der
# lokalen Entwicklung.
spring.datasource.password=${SCIM_DB_PASSWORD:deinpasswort}

# Hibernate-Einstellungen
spring.jpa.hibernate.ddl-auto=update
# Explizit gesetzt: sonst leitet Hibernate den Dialekt aus den JDBC-Metadaten
# ab und braucht dafuer eine Verbindung. Ist die DB nicht erreichbar, verdeckt
# der Folgefehler ("Unable to determine Dialect") die eigentliche Ursache.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# SQL-Logging ueber das Logging-Framework statt ueber spring.jpa.show-sql,
# das an den Appendern vorbei nach System.out schreibt.
logging.level.sql=debug
# Haelt keine Session ueber die Dauer des Requests offen; die Services sind
# transaktional abgegrenzt und brauchen das nicht.
spring.jpa.open-in-view=false

spring.jackson.deserialization.accept-empty-string-as-null-object=true
